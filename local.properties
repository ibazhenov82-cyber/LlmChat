# Расположение Android SDK. Android Studio обычно прописывает этот путь
# автоматически при первом открытии проекта.
#sdk.dir=/path/to/Android/sdk

# Ключ DeepSeek API (получить на https://platform.deepseek.com/api_keys)
DEEPSEEK_API_KEY=your_deepseek_api_key_here

# Адрес локального сервера Ollama с моделью qwen3:0.6b.
# Формат: http://<LOCALHOST>:<PORT>/
# Для эмулятора Android используйте 10.0.2.2 (алиас localhost хост-машины):
LOCAL_HOST_QWEN3=http://10.0.2.2:11434/
